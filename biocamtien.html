    function createSongNotification() {
      const notification = document.createElement('div');
      notification.className = 'song-notification';
      notification.innerHTML = `
        <div class="notification-content">
          <i class="bi bi-music-note-beamed"></i>
          <span id="currentSongText">Đang phát: ${songNames[0]}</span>
        </div>
      `;
      document.body.appendChild(notification);
    }

    function playCurrentSong() {
      audio.src = playlist[currentSongIndex];
      audio.volume = 0.7;
      audio.load();
      
      // Update active song in list
      document.querySelectorAll('.song-list-item').forEach((item, index) => {
        item.classList.toggle('active', index === currentSongIndex);
      });
    }

    function playNextSong() {
      currentSongIndex = (currentSongIndex + 1) % playlist.length;
      playCurrentSong();
      audio.play();
      updateMusicIcons('play');
      showSongNotification();
    }

    function playPreviousSong() {
      currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
      playCurrentSong();
      audio.play();
      updateMusicIcons('play');
      showSongNotification();
    }

    function togglePlayPause() {
      if (audio.paused) {
        audio.play();
        updateMusicIcons('play');
      } else {
        audio.pause();
        updateMusicIcons('pause');
      }
    }

    function updateMusicIcons(state) {
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      
      if (state === 'play') {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    function openSongList() {
      document.querySelector('.song-list-panel').classList.add('show');
    }

    function closeSongList() {
      document.querySelector('.song-list-panel').classList.remove('show');
    }

    function selectSong(index) {
      currentSongIndex = index;
      playCurrentSong();
      
      audio.play().then(() => {
        updateMusicIcons('play');
        showSongNotification();
        closeSongList();
      }).catch(error => {
        console.log('Không thể phát nhạc:', error);
        updateMusicIcons('pause');
        showSongNotification();
        closeSongList();
      });
    }

    function showSongNotification() {
      const notification = document.querySelector('.song-notification');
      const songText = document.getElementById('currentSongText');
      
      songText.textContent = `Đang phát: ${songNames[currentSongIndex]}`;
      notification.classList.add('show');
      
      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }

    function autoPlayMusic() {
      audio.load();
      const playPromise = audio.play();
      
      if (playPromise !== undefined) {
        playPromise.then(() => {
          console.log('Nhạc tự động phát thành công');
          updateMusicIcons('play');
          showSongNotification();
        }).catch(error => {
          console.log('Tự động phát bị chặn, đang chờ tương tác người dùng');
          showInteractionNotification();
          document.body.addEventListener('click', enableAudioOnInteraction, { once: true });
        });
      }
    }

    function showInteractionNotification() {
      const notification = document.createElement('div');
      notification.className = 'interaction-notification';
      notification.innerHTML = `
        <div class="notification-content">
          <i class="bi bi-music-note-beamed"></i>
          <span>Nhấn vào trang để bật nhạc</span>
        </div>
      `;
      document.body.appendChild(notification);
      
      setTimeout(() => {
        if (notification.parentNode) notification.remove();
      }, 5000);
    }

    function enableAudioOnInteraction() {
      const interactionNotification = document.querySelector('.interaction-notification');
      if (interactionNotification) interactionNotification.remove();
      
      audio.play().then(() => {
        console.log('Nhạc đã được bật sau tương tác người dùng');
        updateMusicIcons('play');
        showSongNotification();
      }).catch(error => {
        console.log('Vẫn không thể phát nhạc:', error);
      });
    }
    </script>
    
    <script>
    window.onload = function () {
        startClock();
        initMusicPlayer(); // 👈 thêm dòng này
    };
</script>
    
    <script src="security.js"></script>
</body>
